[project]
name = "ap-agent"
version = "1.0.0"
description = "Accounts-payable processing and RAG workflow agent with deterministic reconciliation and an approval gate"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.7,<3",
    "fastapi>=0.118,<1",
    "uvicorn>=0.38,<1",
    "typer>=0.20,<1",
    "rank-bm25>=0.2.2,<0.3",
    "python-frontmatter>=1.1,<2",
    "anthropic>=0.75,<1",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
hybrid = [
    "sentence-transformers>=3.3,<6",
]

[project.scripts]
ap-agent = "ap_agent.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "hypothesis>=6.120,<7",
    "ruff>=0.14,<1",
    "mypy>=1.14,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ap_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "ASYNC",         # async correctness
    "S",             # bandit security
    "DTZ",           # naive datetime
    "TRY",           # exception anti-patterns
]
ignore = [
    "TRY003",  # long messages in exceptions are useful here
    "TRY400",  # logger.error is intentional in some handlers
    "B008",    # FastAPI Depends() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # asserts and dummy credentials are expected in tests
"src/ap_agent/tools/mock_backends.py" = ["S311"]  # deterministic pseudo-random for fault profiles

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "live_model: requires external model access (ANTHROPIC_API_KEY); excluded by default",
]
filterwarnings = ["error::DeprecationWarning:ap_agent.*"]

[tool.mypy]
python_version = "3.12"
files = ["src/ap_agent"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
